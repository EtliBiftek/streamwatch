name: Build & Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamwatch-windows-main
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Determine release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"

          VERSION="$(node -e "
            const base = process.argv[1];
            const latest = process.argv[2];
            const parse = (value) => String(value || '0.0.0').replace(/^v/i, '').split('.').slice(0, 3).map((part) => Number.parseInt(part, 10) || 0);
            const compare = (a, b) => {
              for (let i = 0; i < 3; i += 1) {
                if ((a[i] || 0) > (b[i] || 0)) return 1;
                if ((a[i] || 0) < (b[i] || 0)) return -1;
              }
              return 0;
            };
            const baseParts = parse(base);
            const latestParts = parse(latest);
            if (!latest || compare(baseParts, latestParts) > 0) {
              console.log(baseParts.join('.'));
            } else {
              console.log(latestParts[0] + '.' + latestParts[1] + '.' + (latestParts[2] + 1));
            }
          " "$BASE_VERSION" "$LATEST_TAG")"

          echo "Base version: $BASE_VERSION"
          echo "Latest release: ${LATEST_TAG:-none}"
          echo "Release version: $VERSION"

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "STREAMWATCH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check entry.js
          node --check updater-v2.js
          node --check preload.js
          node --check oauth-session-mode.js
          node --check oauth-accounts.js
          node --check oauth-connect-hub.js
          node --check ui-integrations.js
          node --check src/renderer/updater-v2.js
          node --check src/renderer/oauth-accounts.js
          node --check src/renderer/oauth-connect-hub-ui.js

      - name: Build Windows installer
        run: npm run build -- --win --x64 --publish never

      - name: Validate updater metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/latest.yml

          INSTALLER_NAME="$(node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('dist/latest.yml', 'utf8');
          const url = text.match(/^\s*-?\s*url:\s*['\"]?([^'\"\r\n]+)['\"]?\s*$/m);
          const path = text.match(/^path:\s*['\"]?([^'\"\r\n]+)['\"]?\s*$/m);
          const value = (url?.[1] || path?.[1] || '').trim();
          if (!value) process.exit(2);
          process.stdout.write(value);
          NODE
          )"

          echo "latest.yml installer: $INSTALLER_NAME"
          ls -lah dist
          if [ ! -f "dist/$INSTALLER_NAME" ]; then
            echo "ERROR: latest.yml points to '$INSTALLER_NAME' but that installer does not exist in dist/."
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamwatch-windows-${{ env.STREAMWATCH_VERSION }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$STREAMWATCH_VERSION"
          TAG="$VERSION"
          TITLE="Version $VERSION"

          echo "Publishing StreamWatch $VERSION from commit $GITHUB_SHA"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its build assets."
            gh release upload "$TAG" \
              dist/*.exe \
              dist/*.blockmap \
              dist/latest.yml \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              dist/*.exe \
              dist/*.blockmap \
              dist/latest.yml \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
